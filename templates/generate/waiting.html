{% extends "base.html" %}
{% block title %}シフト生成中 - SDU-Shift{% endblock %}
{% block head %}
<style>
  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.04); opacity: 1; }
    100% { transform: scale(1); opacity: 0.9; }
  }
  .pulse-card {
    animation: pulse 4s infinite ease-in-out;
  }
  
  @keyframes spin-slow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .spin-slow {
    display: inline-block;
    animation: spin-slow 15s infinite linear;
  }
  
  /* プログレスバーのプレミアム化 */
  .progress {
    background: rgba(148, 163, 184, 0.1) !important;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
  }
  .progress-bar-premium {
    background: linear-gradient(90deg, #0ea5e9 0%, #38bdf8 100%);
    box-shadow: 0 2px 4px rgba(14,165,233,0.25);
    transition: width 0.4s cubic-bezier(0.1, 0.8, 0.25, 1);
  }
  .progress-bar-premium.bg-warning {
    background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 100%) !important;
    box-shadow: 0 2px 4px rgba(245,158,11,0.25);
  }
  .progress-bar-premium.bg-success {
    background: linear-gradient(90deg, #10b981 0%, #34d399 100%) !important;
    box-shadow: 0 2px 4px rgba(16,185,129,0.25);
  }
  .progress-bar-premium.bg-danger {
    background: linear-gradient(90deg, #ef4444 0%, #f87171 100%) !important;
    box-shadow: 0 2px 4px rgba(239,68,68,0.25);
  }

  /* 待ち時間Tips */
  #tip-text {
    transition: opacity .4s ease;
  }
  #tip-text.tip-fade {
    opacity: 0;
  }
</style>
{% endblock %}
{% block content %}
<div class="page-header">
  <h1><i class="bi bi-hourglass-split me-2"></i>シフト生成中</h1>
</div>

<div class="content">
  <div class="card mx-auto pulse-card" style="max-width:560px">
    <div class="card-body py-4 text-center">
      <div class="mb-3">
        <i class="bi bi-cpu fs-1 text-primary spin-slow" id="status-icon"></i>
      </div>
      <h6 class="mb-1">{{ period.start_date }} 〜 {{ period.end_date }}</h6>
      <p class="mb-3" id="status-msg" style="min-height:1.4em">
        <span class="text-muted small">モデルを構築しています…</span>
      </p>

      <!-- 生成完了時の注意事項（ある場合のみ表示） -->
      <div id="warn-box" class="alert alert-warning text-start small py-2 mb-3" style="display:none"></div>

      <!-- 注意事項確認後にシフト表へ進むボタン -->
      <a id="goto-btn" href="{{ url_for('schedule.index', period_id=period.id) }}"
         class="btn btn-success btn-sm mb-2" style="display:none">
        <i class="bi bi-arrow-right-circle me-1"></i>シフト表へ進む
      </a>

      <!-- フェーズ表示 -->
      <div class="d-flex justify-content-between align-items-center small mb-1">
        <span id="phase-label" class="fw-semibold text-primary">
          <i class="bi bi-search me-1"></i>ステップ 1/2: 最適解を探索中
        </span>
        <span id="pct-label" class="text-muted">0%</span>
      </div>

      <!-- プログレスバー -->
      <div class="progress mb-2" style="height:14px;border-radius:7px">
        <div id="prog-bar"
             class="progress-bar progress-bar-striped progress-bar-animated progress-bar-premium bg-primary"
             role="progressbar"
             style="width:0%">
        </div>
      </div>

      <!-- 経過時間 & 発見数 -->
      <div class="d-flex justify-content-between small text-muted mb-2">
        <span id="elapsed-label">待機中…</span>
        <span id="solution-label"></span>
      </div>
    </div>
  </div>

  <!-- 待ち時間Tips -->
  <div class="card mx-auto mt-3" style="max-width:560px">
    <div class="card-body py-3 px-3">
      <div class="d-flex align-items-start small text-muted">
        <i class="bi bi-lightbulb me-2 text-warning" style="flex-shrink:0;margin-top:.1rem"></i>
        <div id="tip-text"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  // ── 待ち時間Tips ──────────────────────────────────────────────────────
  const TIPS = [
    '正社員が希望した枠は必ず優先的に充当され、残りをアルバイトの希望を考慮しながら補完します。',
    '各時間帯・ポジションには「リーダー」の最低人数を設定しており、経験豊富なスタッフが必ず配置されるよう計算しています。',
    'ホール専任・キッチン専任の設定がある従業員は、生成時にその専任ポジション以外へは配置されません。',
    '自動生成はあくまで下書きです。生成後もシフト表画面で個別に手動修正できます。',
    'シフト表はPDF・Excel形式でエクスポートできます（従業員×日付のマトリクス形式）。',
    '従業員データや希望シフトはJSON形式でバックアップ・復元が可能です。',
    '特定のスタッフに残業や深夜勤務が偏らないよう配慮しながら人員配置を計算しています。',
    '制約を満たす解が見つからない場合は、一部の制約を緩和して実行可能な案を再構築しています。',
    '画面はダークモードにも対応しており、OSの設定に合わせて自動で切り替わります。',
    '不具合や要望はヘルプ画面の「不具合を報告する・要望を送る」から送信できます。',
  ];
  const tipText = document.getElementById('tip-text');
  let tipIndex = Math.floor(Math.random() * TIPS.length);
  tipText.textContent = TIPS[tipIndex];

  function rotateTip() {
    tipText.classList.add('tip-fade');
    setTimeout(() => {
      tipIndex = (tipIndex + 1) % TIPS.length;
      tipText.textContent = TIPS[tipIndex];
      tipText.classList.remove('tip-fade');
    }, 400);
  }
  setInterval(rotateTip, 5000);

  // ── 定数 ──────────────────────────────────────────────────────────────
  const MAX_SEC_P1 = 25.0;   // フェーズ1の最大秒数
  const MAX_SEC_P2 = 45.0;   // フェーズ2の最大秒数
  const TIMEOUT_SEC = 240;   // これを超えたら異常とみなす
  const scheduleUrl = "{{ url_for('schedule.index', period_id=period.id) }}";

  // ── DOM ───────────────────────────────────────────────────────────────
  const bar         = document.getElementById('prog-bar');
  const pctLabel    = document.getElementById('pct-label');
  const phaseLabel  = document.getElementById('phase-label');
  const elapsedLabel= document.getElementById('elapsed-label');
  const solutionLabel=document.getElementById('solution-label');
  const statusMsg   = document.getElementById('status-msg');
  const statusIcon  = document.getElementById('status-icon');

  // ── 状態 ──────────────────────────────────────────────────────────────
  const pageStart = Date.now();       // ページ読み込み基点
  let phase2Start = null;             // フェーズ2に入った wall-clock
  let lastServerElapsed = 0;          // 最後にサーバーから受け取った elapsed
  let lastServerAt = Date.now();      // そのときのクライアント時刻
  let currentPhase = 1;
  let rafId = null;

  // ── バー描画 ──────────────────────────────────────────────────────────
  function setBar(pct) {
    const p = Math.min(100, Math.max(0, pct));
    bar.style.width = p + '%';
    pctLabel.textContent = Math.round(p) + '%';
  }

  // ── クライアント側アニメーション（60fps） ──────────────────────────────
  function tick() {
    const nowMs = Date.now();

    if (currentPhase === 1) {
      // サーバー elapsed + クライアント補間
      const clientDelta = (nowMs - lastServerAt) / 1000;
      const estimated = lastServerElapsed + clientDelta;
      setBar(Math.min(95, (estimated / MAX_SEC_P1) * 100));
      elapsedLabel.textContent = estimated.toFixed(1) + '秒経過 / 最大' + MAX_SEC_P1 + '秒';
    } else {
      // フェーズ2: phase2Start からの経過
      if (phase2Start !== null) {
        const p2elapsed = (nowMs - phase2Start) / 1000;
        setBar(Math.min(95, (p2elapsed / MAX_SEC_P2) * 100));
        elapsedLabel.textContent = p2elapsed.toFixed(1) + '秒経過 / 最大' + MAX_SEC_P2 + '秒';
      }
    }

    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);

  // ── サーバー更新を反映 ─────────────────────────────────────────────────
  function applyGenerating(data) {
    const newPhase = data.phase || 1;

    if (newPhase === 2 && currentPhase === 1) {
      // フェーズ切り替え（表示の切り替えは初回のみ）
      currentPhase = 2;
      phase2Start = Date.now();
      phaseLabel.innerHTML =
        '<i class="bi bi-arrow-repeat me-1"></i>ステップ 2/2: ベストエフォートで再構築中';
      phaseLabel.classList.remove('text-primary');
      phaseLabel.classList.add('text-warning');

      statusIcon.classList.remove('text-primary');
      statusIcon.classList.add('text-warning');

      bar.classList.remove('bg-primary');
      bar.classList.add('bg-warning');
    }

    if (currentPhase === 1) {
      lastServerElapsed = data.elapsed || 0;
      lastServerAt = Date.now();
    }

    // 解の発見数・メッセージ（フェーズ1・2とも継続して更新する）
    const n = data.solutions || 0;
    if (currentPhase === 1) {
      if (n > 0) {
        solutionLabel.textContent = '解 ' + n + ' 件発見';
        statusMsg.innerHTML = (n === 1)
          ? '<span class="text-primary small fw-semibold">初期解を発見 — より良い解を探索中…</span>'
          : '<span class="text-primary small fw-semibold">解を改善中（' + n + ' 回更新）</span>';
      } else {
        solutionLabel.textContent = '';
        statusMsg.innerHTML =
          '<span class="text-muted small">制約を満たす初期解を探索中…</span>';
      }
    } else {
      solutionLabel.textContent = n > 0 ? '解 ' + n + ' 件発見' : '';
      statusMsg.innerHTML =
        '<span class="text-warning small">制約を緩和して実行可能なシフトを生成しています' +
        (n > 0 ? '（' + n + ' 回更新）' : '…') + '</span>';
    }
  }

  // ── HTMLエスケープ ────────────────────────────────────────────────────
  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  // ── 完了・エラー処理 ───────────────────────────────────────────────────
  function finish(ok, warnOrErr) {
    cancelAnimationFrame(rafId);
    setBar(100);
    bar.classList.remove('progress-bar-animated', 'progress-bar-striped',
                          'bg-primary', 'bg-warning');
    bar.style.transition = 'width 0.5s ease-out';
    
    // アニメーション停止
    statusIcon.classList.remove('spin-slow');
    
    if (ok) {
      bar.classList.add('bg-success');
      phaseLabel.innerHTML = '<i class="bi bi-check-circle me-1"></i>生成完了';
      phaseLabel.classList.remove('text-primary', 'text-warning');
      phaseLabel.classList.add('text-success');
      
      statusIcon.classList.remove('text-primary', 'text-warning');
      statusIcon.classList.add('text-success');
      statusIcon.className = 'bi bi-check-circle-fill fs-1 text-success';
      
      elapsedLabel.textContent = '完了';

      const warnings = Array.isArray(warnOrErr) ? warnOrErr : [];
      const gotoBtn = document.getElementById('goto-btn');
      if (warnings.length > 0) {
        statusMsg.innerHTML =
          '<span class="text-success fw-semibold">生成完了 — 下記の注意事項をご確認ください</span>';
        const warnBox = document.getElementById('warn-box');
        warnBox.innerHTML = '<i class="bi bi-exclamation-triangle me-1"></i>注意事項' +
          '<ul class="mb-0 ps-3 mt-1">' +
          warnings.map(w => '<li>' + escapeHtml(w) + '</li>').join('') +
          '</ul>';
        warnBox.style.display = '';
        gotoBtn.style.display = '';
        setTimeout(() => { window.location.href = scheduleUrl; }, 6000);
      } else {
        statusMsg.innerHTML =
          '<span class="text-success fw-semibold">シフト表に移動します…</span>';
        setTimeout(() => { window.location.href = scheduleUrl; }, 800);
      }
    } else {
      const msg = typeof warnOrErr === 'string' ? warnOrErr : '';
      bar.classList.add('bg-danger');
      phaseLabel.innerHTML = '<i class="bi bi-exclamation-triangle me-1"></i>生成失敗';
      phaseLabel.classList.remove('text-primary', 'text-warning');
      phaseLabel.classList.add('text-danger');
      
      statusIcon.classList.remove('text-primary', 'text-warning');
      statusIcon.className = 'bi bi-x-circle-fill fs-1 text-danger';
      
      elapsedLabel.textContent = 'エラー';
      statusMsg.innerHTML =
        '<span class="text-danger small">' + (msg || '生成に失敗しました') + '</span>';
    }
  }

  function showTimeout() {
    cancelAnimationFrame(rafId);
    bar.classList.remove('progress-bar-animated', 'bg-primary', 'bg-warning');
    bar.classList.add('bg-secondary');
    phaseLabel.innerHTML = '<i class="bi bi-clock-history me-1"></i>応答なし';
    phaseLabel.className = 'fw-semibold text-secondary';
    elapsedLabel.textContent = 'タイムアウト';
    statusMsg.innerHTML =
      '<span class="text-muted small">ページを再読み込みして再度お試しください。</span>';
  }

  // ── ポーリング ────────────────────────────────────────────────────────
  function poll() {
    if ((Date.now() - pageStart) / 1000 > TIMEOUT_SEC) {
      showTimeout();
      return;
    }

    fetch("{{ url_for('generate.status', period_id=period.id) }}")
      .then(r => r.json())
      .then(data => {
        if (data.status === 'done') {
          const rawMsg = data.message || '';
          const warnings = rawMsg.split('|').slice(1).filter(w => w.trim());
          finish(true, warnings);
        } else if (data.status === 'failed') {
          finish(false, data.message);
        } else {
          applyGenerating(data);
          setTimeout(poll, 2000);
        }
      })
      .catch(() => setTimeout(poll, 3000));
  }

  setTimeout(poll, 1500);
})();
</script>
{% endblock %}
