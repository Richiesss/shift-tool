<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>オフライン - SDU-Shift</title>
  <style>
    html, body {
      margin: 0; height: 100%;
      background: linear-gradient(165deg, #020617 0%, #0f172a 45%, #1e293b 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      padding-top: calc(2rem + env(safe-area-inset-top, 0px));
      padding-bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
    }
    img { width: 96px; height: 96px; border-radius: 20px; margin-bottom: 1.5rem; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { color: #94a3b8; margin: 0 0 1.5rem; line-height: 1.6; }
    button {
      background: #0ea5e9; color: #fff; border: none; border-radius: 10px;
      padding: .7rem 1.5rem; font-size: 1rem; cursor: pointer;
    }
    button:active { background: #0284c7; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/static/icons/icon-192.png" alt="SDU-Shift">
    <h1>オフラインです</h1>
    <p>インターネット接続を確認してから<br>再度お試しください。</p>
    <button onclick="location.reload()">再読み込み</button>
  </div>
</body>
</html>
