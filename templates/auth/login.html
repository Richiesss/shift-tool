<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <title>ログイン - SDU-Shift</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body { background: #0f172a; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 360px; border-radius: 16px;
                  background: #1e293b; color: white; padding: 2rem; }
    .login-card .logo { font-size: 2.5rem; margin-bottom: .5rem; }
    .login-card h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: .25rem; }
    .login-card p  { color: #94a3b8; font-size: .85rem; margin-bottom: 1.5rem; }
    .form-control {
      background: #0f172a; border-color: #334155; color: white;
      border-radius: 10px; padding: .75rem 1rem;
    }
    .form-control:focus { background: #0f172a; color: white;
                          border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,.2); }
    .btn-login {
      background: #0ea5e9; border: none; border-radius: 10px;
      padding: .75rem; font-weight: 600; width: 100%; font-size: 1rem;
    }
    .btn-login:hover { background: #0284c7; }
    .alert { border-radius: 10px; font-size: .85rem; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="logo text-center">🍽️</div>
  <h1 class="text-center">SDU-Shift</h1>
  <p class="text-center">飲食店向けシフト管理</p>

  {% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in msgs %}
  <div class="alert alert-danger py-2 mb-3">
    <i class="bi bi-exclamation-circle me-1"></i>{{ msg }}
  </div>
  {% endfor %}
  {% endwith %}

  <form method="post" action="{{ url_for('auth.login_post') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
    <div class="mb-3">
      <label class="form-label small text-muted">アクセスパスワード</label>
      <input type="password" name="password" class="form-control"
             placeholder="パスワードを入力" autofocus autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-login text-white">
      <i class="bi bi-box-arrow-in-right me-1"></i>ログイン
    </button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
