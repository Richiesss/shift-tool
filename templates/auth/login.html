<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <!-- キャッシュ無効化 -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <title>ログイン - SDU-Shift</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body { background: #0f172a; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 360px; border-radius: 16px;
                  background: #1e293b; color: white; padding: 2rem; }
    .login-card .logo { font-size: 2.5rem; margin-bottom: .5rem; }
    .login-card h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: .25rem; }
    .login-card p  { color: #94a3b8; font-size: .85rem; margin-bottom: 1.5rem; }
    .form-control {
      background: #0f172a; border-color: #334155; color: white;
      border-radius: 10px; padding: .75rem 1rem;
    }
    .form-control:focus { background: #0f172a; color: white;
                          border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,.2); }
    .input-group .btn-outline-secondary {
      background: #0f172a; border-color: #334155; color: #94a3b8;
    }
    .input-group .btn-outline-secondary:hover,
    .input-group .btn-outline-secondary:focus { background: #1e293b; color: white; border-color: #334155; }
    .input-group:focus-within .form-control,
    .input-group:focus-within .btn-outline-secondary { border-color: #38bdf8; }
    .btn-login {
      background: #0ea5e9; border: none; border-radius: 10px;
      padding: .75rem; font-weight: 600; width: 100%; font-size: 1rem;
      transition: background .15s;
    }
    .btn-login:hover { background: #0284c7; }
    .btn-login:disabled { background: #334155; cursor: not-allowed; }
    .alert { border-radius: 10px; font-size: .85rem; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="logo text-center">
    <img src="/static/icons/icon-192.png" alt="SKY DINING UOMAN"
         style="width:80px;height:80px;object-fit:contain;border-radius:16px">
  </div>
  <h1 class="text-center">SDU-Shift</h1>
  <p class="text-center">スタッフシフト管理</p>

  {% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in msgs %}
  <div class="alert alert-{{ 'danger' if cat == 'error' else 'warning' }} py-2 mb-3">
    <i class="bi bi-exclamation-circle me-1"></i>{{ msg }}
  </div>
  {% endfor %}
  {% endwith %}

  <!-- action は直接 /login を指定してシンプルに -->
  <form id="loginForm" method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if request.args.get('next') %}
    <input type="hidden" name="next" value="{{ request.args.get('next') }}">
    {% endif %}
    <div class="mb-3">
      <label class="form-label small text-muted">アクセスパスワード</label>
      <div class="input-group">
        <input type="password" name="password" id="pwInput" class="form-control"
               placeholder="パスワードを入力" autofocus autocomplete="current-password">
        <button type="button" class="btn btn-outline-secondary" id="pwToggle" tabindex="-1" aria-label="パスワードを表示">
          <i class="bi bi-eye"></i>
        </button>
      </div>
    </div>
    <button type="submit" id="loginBtn" class="btn btn-login text-white">
      <i class="bi bi-box-arrow-in-right me-1" id="btnIcon"></i>
      <span id="btnText">ログイン</span>
    </button>
  </form>
</div>

<script>
  // パスワード表示/非表示切り替え
  document.getElementById('pwToggle').addEventListener('click', function() {
    var input = document.getElementById('pwInput');
    var icon = this.querySelector('i');
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
    this.setAttribute('aria-label', show ? 'パスワードを隠す' : 'パスワードを表示');
  });

  // フォーム送信時にローディング状態を表示
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    var btn = document.getElementById('loginBtn');
    var icon = document.getElementById('btnIcon');
    var text = document.getElementById('btnText');
    btn.disabled = true;
    icon.className = 'bi bi-hourglass-split me-1';
    text.textContent = '確認中...';
  });

  // サービスワーカーのキャッシュをバイパス
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      regs.forEach(function(r) { r.unregister(); });
    });
  }
</script>
</body>
</html>
