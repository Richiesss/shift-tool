name: Windows EXE ビルド

on:
  push:
    branches: [ main ]      # main にプッシュするたびに自動ビルド
  workflow_dispatch:         # GitHub 画面から手動実行も可能

jobs:
  build:
    runs-on: windows-latest  # GitHub の Windows サーバーで実行

    steps:
      # 1. ソースコードを取得
      - name: ソースコードをチェックアウト
        uses: actions/checkout@v4

      # 2. Python のセットアップ
      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. 依存パッケージをインストール
      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      # 4. PyInstaller でEXEをビルド
      - name: EXE をビルド
        run: pyinstaller shift_tool.spec --clean --noconfirm

      # 5. テストデータ入りDBを生成してdistフォルダに配置
      - name: テストデータDBを生成
        run: |
          python scripts/seed_test_data.py --reset
          copy "$env:USERPROFILE\.shift_tool\shift_tool.db" "dist\shift_tool.db"
        shell: pwsh

      # 6. ビルド結果を確認
      - name: ビルド結果を確認
        run: |
          dir dist
          echo "EXEサイズ:"
          (Get-Item "dist\シフト表構築ツール.exe").Length / 1MB
        shell: pwsh

      # 7. EXEとDBをアーティファクトとしてアップロード
      - name: EXE と DB をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: シフト表構築ツール-Windows
          path: |
            dist/シフト表構築ツール.exe
            dist/shift_tool.db
          retention-days: 30    # 30日間保持

  # mainへのプッシュ時はリリースも自動作成
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: アーティファクトをダウンロード
        uses: actions/download-artifact@v4
        with:
          name: シフト表構築ツール-Windows

      - name: リリースを作成してEXEをアップロード
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "シフト表構築ツール (Build ${{ github.run_number }})"
          body: |
            ## ダウンロード
            `シフト表構築ツール.exe` と `shift_tool.db` を**同じフォルダ**に置いて実行してください。

            | ファイル | 説明 |
            |---|---|
            | `シフト表構築ツール.exe` | アプリ本体 |
            | `shift_tool.db` | テストデータ入りDB（2024年3月1〜15日, 38名） |

            **動作環境**: Windows 10 / 11 (64bit)

            ## 変更内容
            ${{ github.event.head_commit.message }}
          files: |
            シフト表構築ツール.exe
            shift_tool.db
          draft: false
          prerelease: false
