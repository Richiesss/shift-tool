services:
  - type: web
    name: sdu-shift
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "web_app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sdu-shift-db
          property: connectionString
    autoDeploy: true

databases:
  - name: sdu-shift-db
    plan: free
